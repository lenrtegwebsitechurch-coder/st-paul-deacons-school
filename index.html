<style>
:root{--bg:#faf7f2;--cd:#fff;--tx:#2a2118;--mu:#7a6c5d;--ac:#8a5a2b;--bd:#e6dccd;--ok:#2e7d4f;--no:#b3392f;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1712;--cd:#272019;--tx:#f1e8dc;--mu:#a89a88;--ac:#d9a15f;--bd:#3a3128;--ok:#5fc08a;--no:#e8776d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1712;--cd:#272019;--tx:#f1e8dc;--mu:#a89a88;--ac:#d9a15f;--bd:#3a3128;--ok:#5fc08a;--no:#e8776d;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,"Segoe UI",Tahoma,sans-serif;padding:12px;max-width:760px;margin:auto}
h1{font-size:19px;margin:6px 0;text-align:center;color:var(--ac)}h2{font-size:16px;margin:14px 0 6px}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;margin:4px 0}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}
button.g{background:transparent;color:var(--ac);border:1px solid var(--ac)}button.d{background:var(--no)}
.r{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.r>*{flex:1 1 90px}.r>button{flex:0 0 auto}
.t{display:flex;gap:6px;overflow-x:auto;padding:4px 0}.t button{flex:0 0 auto;background:var(--cd);color:var(--tx);border:1px solid var(--bd)}.t button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.row{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--bd);align-items:center}
.mu{color:var(--mu);font-size:14px}.ok{color:var(--ok)}.no{color:var(--no)}.b{font-size:12px;background:var(--bd);border-radius:20px;padding:1px 9px}
.hd{text-align:center;animation:fi .8s ease both}.big{width:170px;height:170px;border-radius:50%;box-shadow:0 6px 22px rgba(138,90,43,.35);animation:fl 5s ease-in-out infinite}
.ft{text-align:center;margin:26px 0 12px;color:var(--mu);font-size:13px;direction:ltr;opacity:.85}.sm{width:42px;height:42px;border-radius:50%;display:block;margin:0 auto 4px}
.c{animation:fi .4s ease both}@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes fl{50%{transform:translateY(-5px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
summary{cursor:pointer;padding:6px 0;font-size:16px}details[open]>summary{border-bottom:1px solid var(--bd);margin-bottom:4px}</style><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
